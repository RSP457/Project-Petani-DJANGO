{% load static %}
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>WebPetani</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- CSS utama -->
    <link href="{% static 'agency/css/styles.css' %}" rel="stylesheet" />

    <!-- CSS khusus per halaman -->
    {% block extra_css %}{% endblock %}

    <!-- CSS global produk -->
    <style>
      .product-card {
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.2s ease-in-out;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-img {
        height: 220px;
        width: 100%;
        object-fit: cover;
      }

      .product-card .card-body {
        display: flex;
        flex-direction: column;
      }

      .product-card .btn {
        margin-top: auto;
      }
    </style>
  </head>

  <body id="page-top">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">🌾 WebPetani</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profil/">Profil</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/peta/">Peta</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/produk/">Produk</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- KONTEN HALAMAN -->
    <main style="margin-top: 80px">{% block content %}{% endblock %}</main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer py-4 bg-dark text-white">
      <div class="container text-center">
        <p class="mb-0">© 2025 WebPetani | Pak Jamaludin</p>
        <small> Sistem Informasi Pemasaran Hasil Pertanian </small>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS tambahan per halaman -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
