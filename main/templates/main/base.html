{% load static %}
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>WebPetani</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- CSS utama -->
    <link href="{% static 'agency/css/styles.css' %}" rel="stylesheet" />

    {% block extra_css %}{% endblock %}
    <style>
      .about-section {
        background-color: #f8f9fa;
      }

      .about-title {
        font-size: 2.2rem;
        font-weight: 700;
        color: #2c3e50;
      }

      .about-subtitle {
        font-size: 1rem;
        color: #6c757d;
        max-width: 600px;
        margin: 0 auto;
      }

      .about-text {
        font-size: 1rem;
        color: #444;
        line-height: 1.8;
      }

      .about-card {
        background: #ffffff;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .about-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .about-list li {
        font-size: 1rem;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }

      .about-list li:last-child {
        border-bottom: none;
      }
    </style>
    <style>
      /* RESET */
      body {
        margin: 0;
        padding-top: 70px; /* ruang navbar fixed */
      }

      /* NAVBAR */
      .navbar {
        height: 70px;
      }

      header.masthead {
        position: relative;
        background-image: url("/static/agency/assets/img/header-bg.jpg");
        background-size: cover;
        background-position: center;
      }

      header.masthead::before {
        content: "";
        position: absolute;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.55);
        z-index: 1;
      }

      header.masthead .container {
        position: relative;
        z-index: 2;
      }

      /* SECTION NORMAL */
      .page-section {
        padding: 80px 0;
      }

      /* PRODUK */
      .product-card {
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.2s ease-in-out;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-img {
        height: 220px;
        width: 100%;
        object-fit: cover;
      }

      .product-card .card-body {
        display: flex;
        flex-direction: column;
      }

      .product-card .btn {
        margin-top: auto;
      }
    </style>
  </head>

  <body id="page-top">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">🌾 WebPetani</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="/profil/">Profil</a></li>
            <li class="nav-item"><a class="nav-link" href="/peta/">Peta</a></li>
            <li class="nav-item"><a class="nav-link" href="/produk/">Produk</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- KONTEN HALAMAN -->
    <main>{% block content %}{% endblock %}</main>

    <!-- FOOTER -->
    <footer class="footer py-4 bg-dark text-white">
      <div class="container text-center">
        <p class="mb-0">© 2025 WebPetani | Pak Jamaludin</p>
        <small>Sistem Informasi Pemasaran Hasil Pertanian</small>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
