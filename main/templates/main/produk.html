{% extends 'main/base.html' %} {% load static %} {% block content %}
<section class="page-section">
  <div class="container">
    <h2 class="text-center">Pemasaran Hasil Panen</h2>
    <div class="row">
      {% for p in produk %}
      <div class="col-md-4">
        <div style="border: 1px solid #ddd; padding: 15px; margin-bottom: 20px">
          {% if p.foto %}
          <img src="{{ p.foto.url }}" width="100%" height="200" style="object-fit: cover" />
          {% else %}
          <p>Foto belum tersedia</p>
          {% endif %}

          <h4>{{ p.nama_produk }}</h4>
          <p><b>Stok:</b> {{ p.stok }}</p>
          <p><b>Harga:</b> {{ p.harga }}</p>

          <a
            href="https://wa.me/6282262125101?text=Halo%20saya%20ingin%20memesan%20produk%20{{ p.nama_produk }}"
            target="_blank"
            style="display: inline-block; padding: 10px 20px; background: #25d366; color: white; text-decoration: none; border-radius: 5px"
          >
            Pesan via WhatsApp
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
